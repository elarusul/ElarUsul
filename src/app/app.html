<div class="page-bg" aria-hidden="true">
  <div class="page-bg__fill"></div>
  <div class="page-bg__clouds"></div>
  <div class="page-bg__heroes"></div>
  <div class="page-bg__frame">
    <span class="page-bg__c page-bg__c--tl"></span>
    <span class="page-bg__c page-bg__c--tr"></span>
    <span class="page-bg__c page-bg__c--bl"></span>
    <span class="page-bg__c page-bg__c--br"></span>
    <span class="page-bg__e page-bg__e--t"></span>
    <span class="page-bg__e page-bg__e--b"></span>
    <span class="page-bg__e page-bg__e--l"></span>
    <span class="page-bg__e page-bg__e--r"></span>
  </div>
</div>

<div class="lang-bar" role="group" [attr.aria-label]="i18n.t()('lang.aria')">
  <button
    type="button"
    class="lang-btn"
    [class.is-active]="i18n.lang() === 'pl'"
    (click)="i18n.setLang('pl')"
  >
    PL
  </button>
  <span class="lang-sep" aria-hidden="true">·</span>
  <button
    type="button"
    class="lang-btn"
    [class.is-active]="i18n.lang() === 'en'"
    (click)="i18n.setLang('en')"
  >
    EN
  </button>
</div>
